name: bizhisab_ai
description: "AI-powered smart business finance and accounting assistant for Bangladesh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.6
  firebase_messaging: ^15.2.8

  # State Management
  provider: ^6.1.5

  # Navigation
  go_router: ^14.8.1

  # HTTP
  http: ^1.3.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Charts
  fl_chart: ^0.70.2

  # Date/Time
  intl: ^0.20.2

  # UI
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  cupertino_progress_bar: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
